[project]
name = "maritime"
version = "0.1.0"
description = "Asistente RAG de contratos para Naviera Portecho"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.5",
    "alembic>=1.13.3",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "flower>=2.0.1",
    "litellm>=1.52.0",
    "tenacity>=9.0.0",
    "pypdf>=5.1.0",
    "pdfplumber>=0.11.4",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-celery>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "pydantic-ai>=2.31.1",
    "opentelemetry-instrumentation-httpx>=0.49b0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.2",
    "testcontainers[postgres]>=4.8.2",
    "testcontainers[redis]>=4.8.2",
    "reportlab>=5.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maritime"]

# -------------------------------------------------------------
# Configuración de Ruff (Linter & Formatter)
# -------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "RUF",    # reglas internas de Ruff
    "ASYNC",  # flake8-async
]
ignore = [
    "E501",   # longitud de línea manejada por el formateador
]

[tool.ruff.lint.isort]
known-first-party = ["maritime"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -------------------------------------------------------------
# Configuración de Mypy (Modo Ultra Estricto)
# -------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "pdfplumber.*",
    "testcontainers.*",
    "opentelemetry.*",
    "litellm.*",
    "reportlab.*",
]
ignore_missing_imports = true

# -------------------------------------------------------------
# Configuración de Pytest
# -------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Pruebas unitarias puras sin I/O externo",
    "integration: Pruebas de integración que requieren Docker / Testcontainers",
]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
]
